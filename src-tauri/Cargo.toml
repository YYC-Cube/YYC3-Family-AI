[package]
name = "yyc3-family-ai"
version = "1.0.0"
description = "YYC3 Family AI - 智能编程助手"
authors = ["YanYuCloudCube Team <admin@0379.email>"]
license = "MIT"
repository = "https://github.com/YanYuCloudCube/yyc3-family-ai"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "fs-all", "window-all", "protocol-asset", "dialog-all", "clipboard-all", "shell-execute", "shell-open", "path-all", "notification-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
whoami = "1.4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
